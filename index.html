<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

    <div class="app">

        <h1 class="app-title">Finance Tracker</h1>

        <p class="app-subtitle">Personal finance tracker</p>

        <div class="dashboard">

            <section class="transaction-form">

                <h2>Add Transaction</h2>

                <input type="text" id="description" placeholder="Description">

                <p class="error-message" id="description-error"></p>

                <input type="number" id="amount" placeholder="Amount">

                <p class="error-message" id="amount-error"></p>

                <select id="type">

                    <option value="expense">Expense</option>

                    <option value="income">Income</option>

                </select>

                <input type="text" id="category" placeholder="Category">

                <p class="error-message" id="category-error"></p>

                <label for="date">Date</label>

                <input type="date" id="date">

                <button id="add-transaction">

                    <span id="transaction-button-text">Add transaction</span>

                </button>

            </section>

            <div class="card income-card">

                <p class="card-label">Income</p>

                <h2 class="card-value" id="income-amount">R0.00</h2>

            </div>

            <div class="card expense-card">

                <p class="card-label">Expenses</p>

                <h2 class="card-value" id="expense-amount">R0.00</h2>

            </div>

            <div class="card balance-card">

                <p class="card-label">Balance</p>

                <h2 class="card-value" id="balance-amount">R0.00</h2>

            </div>

        </div>

        <section class="transaction-list">

            <h2>Transactions</h2>

            <div class="filters">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search transactions"
                >

                <select id="type-filter">

                    <option value="all">All Transactions</option>

                    <option value="income">Income</option>

                    <option value="expense">Expense</option>

                </select>

                <select id="category-filter">

                    <option value="all">All Categories</option>

                </select>

                <select id="sort-filter">

                    <option value="newest">Newest First</option>

                    <option value="oldest">Oldest First</option>

                    <option value="highest">Highest Amount</option>

                    <option value="lowest">Lowest Amount</option>

                </select>

            </div>

            <div id="transactions-container"></div>

        </section>

        <section class="budget-section">

            <h2>Budget</h2>

            <div class="budget-form">

                <input type="text" id="budget-category" placeholder="Category">

                <input type="number" id="budget-limit" placeholder="Budget limit">

                <button id="add-budget">

                    <span id="budget-button-text">Add Budget</span>

                </button>

            </div>

            <p class="error-message" id="budget-error"></p>

            <div id="overall-budget"></div>

            <div id="budget-container"></div>

            <div id="insights"></div>

        </section>

    </div>
    <div id="edit-transaction-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Edit Transaction</h2>

            <button id="close-edit-modal" class="modal-close">&times;</button>

        </div>

        <input type="text" id="edit-description" placeholder="Description">

        <p class="error-message" id="edit-description-error"></p>

        <input type="number" id="edit-amount" placeholder="Amount">

        <p class="error-message" id="edit-amount-error"></p>

        <select id="edit-type">

            <option value="expense">Expense</option>

            <option value="income">Income</option>

        </select>

        <input type="text" id="edit-category" placeholder="Category">

        <p class="error-message" id="edit-category-error"></p>

        <label for="edit-date">Date</label>

        <input type="date" id="edit-date">

        <button id="save-edit-transaction">

            Save Changes

        </button>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
